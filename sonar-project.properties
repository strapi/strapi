sonar.projectKey=strapi_strapi
sonar.organization=strapi

# This is the name and version displayed in the SonarQube Cloud UI.
sonar.projectName=Strapi
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.

# Coverage reports - unit and front downloaded to separate dirs to avoid overwrite; glob matches all lcov files
sonar.javascript.lcov.reportPaths=unit-coverage/**/lcov.info,front-coverage/**/lcov.info

# Repo-root front tooling uses `yarn verify:translations:test` (node:test), not nx jest/vitest
# coverage uploaded to Sonar — exclude from the coverage quality gate.
sonar.coverage.exclusions=scripts/front/**

# Exclude patterns
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.config.js,**/*.config.mjs,**/jest.*.js,**/vitest.*.ts,**/rollup.*.js,**/babel.*.js,**/*.d.ts,**/public/**,**/static/**,**/docs/**,**/examples/**,**/test-apps/**,**/tests/**,**/__tests__/**,**/*.test.js,**/*.test.ts,**/*.spec.js,**/*.spec.ts

# Test file patterns (for test coverage calculation)
sonar.test.inclusions=**/__tests__/**/*.{js,ts,jsx,tsx},**/*.test.{js,ts,jsx,tsx},**/*.spec.{js,ts,jsx,tsx}

# Duplication exclusions
sonar.cpd.exclusions=**/__tests__/**,**/test/**,**/tests/**

# Ignore rules that flag deliberate TypeScript patterns in server packages
sonar.issue.ignore.multicriteria=emptyTypeImport,exactOptional
# `import type {} from '…'` loads registry type augmentations without a runtime import
sonar.issue.ignore.multicriteria.emptyTypeImport.ruleKey=typescript:S7787
sonar.issue.ignore.multicriteria.emptyTypeImport.resourceKey=packages/**/server/src/**/*.ts
# `?: T | undefined` keeps optional properties assignable for consumers who enable exactOptionalPropertyTypes
sonar.issue.ignore.multicriteria.exactOptional.ruleKey=typescript:S4782
sonar.issue.ignore.multicriteria.exactOptional.resourceKey=packages/**/server/src/**/*.ts

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
