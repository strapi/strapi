defaultSemverRangePrefix: ''

nodeLinker: node-modules

preferInteractive: true

yarnPath: .yarn/releases/yarn-4.12.0.cjs

catalog:
  vitest: ^4.0.18

packageExtensions:
  # @actions/github@6.0.0 does `require("undici")` in lib/internal/utils.js but
  # never declares it, so it only resolves when undici happens to be hoisted.
  '@actions/github@*':
    dependencies:
      undici: ^5.25.4

  # @strapi/design-system is the closure the admin build resolves the CodeMirror
  # singletons from, but it only declares 4 of the 7; the rest are transitive via
  # @codemirror/lang-json and @uiw/react-codemirror. Ranges match those parents so
  # they dedupe onto the same copies instead of adding new ones.
  '@strapi/design-system@*':
    dependencies:
      '@codemirror/language': ^6.0.0
      '@codemirror/commands': ^6.1.0
      '@codemirror/lint': ^6.0.0
