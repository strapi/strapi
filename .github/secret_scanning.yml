# The debug-dump secret scrubber's unit tests contain format-accurate but fake
# provider tokens (Stripe, GitLab, etc.) used solely to verify that such shapes
# are redacted. They are not real credentials. Exclude the file from secret
# scanning and push protection to avoid false positives (approved by the
# security team).
paths-ignore:
  - 'packages/core/admin/server/src/utils/debug-dump/__tests__/redact.test.ts'
