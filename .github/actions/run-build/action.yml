name: 'Monorepo build (yarn)'
description: 'Run yarn build with cache enabled'

runs:
  using: 'composite'

  steps:
    - name: ♻️ Restore build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: yarn-build-cache
      with:
        path: packages/**/dist
        key: yarn-build-cache-${{ github.sha }}
    # Nx task cache from the latest develop build: a PR only rebuilds the packages its changes
    # affect, and Nx restores the rest. Saved from pushes only (see below), so PR runs don't
    # add one cache entry per commit and evict the install caches.
    # Pushes don't restore it: they build every package from scratch, so the cache they save is
    # always a clean build and a missing Nx input can't carry stale output from one commit to the
    # next. (`--skip-nx-cache` would not do: Nx then writes nothing to the cache either.)
    # Nx only replays local artifacts recorded in its own machine-keyed database, so the folder is
    # served to Nx as a self-hosted remote cache (nx-cache-server.mjs) rather than as `.nx/cache`.
    - if: ${{ steps.yarn-build-cache.outputs.cache-hit != 'true' && github.event_name != 'push' }}
      name: ♻️ Restore Nx cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .nx/remote-cache
        key: nx-build-cache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          nx-build-cache-${{ runner.os }}-
    - if: ${{ steps.yarn-build-cache.outputs.cache-hit != 'true' }}
      name: 📥 Run build
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/nx-cache-server.mjs" .nx/remote-cache 4555 &
        server=$!
        trap 'kill "$server"' EXIT
        until curl -s -o /dev/null http://127.0.0.1:4555; do sleep 0.1; done
        yarn nx run-many --targets build --nx-ignore-cycles
      env:
        NX_SELF_HOSTED_REMOTE_CACHE_SERVER: http://127.0.0.1:4555
    - if: ${{ steps.yarn-build-cache.outputs.cache-hit != 'true' }}
      name: 🔎 Check build outputs
      shell: bash
      run: node "$GITHUB_ACTION_PATH/check-build-outputs.js"
    - if: ${{ steps.yarn-build-cache.outputs.cache-hit != 'true' && github.event_name == 'push' }}
      name: 💾 Save Nx cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .nx/remote-cache
        key: nx-build-cache-${{ runner.os }}-${{ github.sha }}
