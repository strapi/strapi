name: 'Monorepo build (yarn)'
description: 'Run yarn build with cache enabled'

runs:
  using: 'composite'

  steps:
    - name: ♻️ Restore build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: yarn-build-cache
      with:
        path: packages/**/dist
        key: yarn-build-cache-${{ github.sha }}
    # Nx task cache from the latest develop build: a PR only rebuilds the packages its changes
    # affect, and Nx restores the rest. Saved from pushes only (see below), so PR runs don't
    # add one cache entry per commit and evict the install caches.
    - if: ${{ steps.yarn-build-cache.outputs.cache-hit != 'true' }}
      name: ♻️ Restore Nx cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .nx/cache
        key: nx-build-cache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          nx-build-cache-${{ runner.os }}-
    - if: ${{ steps.yarn-build-cache.outputs.cache-hit != 'true' }}
      name: 📥 Run build
      shell: bash
      run: yarn nx run-many --targets build --nx-ignore-cycles
      env:
        # Nx 20's database cache only uses artifacts it recorded on the same machine, so it
        # ignores a .nx/cache restored from another runner. The file cache uses them once
        # unknown artifacts are accepted, which is safe here: the cache is only saved from pushes.
        NX_DB_CACHE: 'false'
        NX_REJECT_UNKNOWN_LOCAL_CACHE: '0'
    - if: ${{ steps.yarn-build-cache.outputs.cache-hit != 'true' }}
      name: 🔎 Check build outputs
      shell: bash
      run: node "$GITHUB_ACTION_PATH/check-build-outputs.js"
    - if: ${{ steps.yarn-build-cache.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.head_ref == 'ci/test-speed-experiment') }}
      name: 💾 Save Nx cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .nx/cache
        key: nx-build-cache-${{ runner.os }}-${{ github.sha }}
