name: Check Change Freeze

on:
  pull_request:
    types: [opened]

permissions: read-all

jobs:
  change-freeze-disabled:
    name: 'Change freeze not active'
    if: vars.CHANGE_FREEZE_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Change freeze is not enabled"

  check-ownership:
    name: 'Check if PR was created by a Strapi Team Member'
    if: vars.CHANGE_FREEZE_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      isTeamMember: ${{ steps.get-user-teams-membership.outputs.isTeamMember }}
    steps:
      # Inline `gh api` call so the token is never handed to a third-party action.
      # The endpoint returns 404 for non-members; only an active membership counts.
      # Any other API error (bad token, rate limit, 5xx) fails the step so no comment is posted.
      - name: Check membership of the strapi/team team
        id: get-user-teams-membership
        env:
          GH_TOKEN: ${{ secrets.CHECK_OWNERSHIP_TOKEN }}
          USERNAME: ${{ github.actor }}
        run: |
          if body=$(gh api "orgs/strapi/teams/team/memberships/$USERNAME" 2>&1); then
            state=$(jq -r '.state // empty' <<< "$body")
          elif grep -q 'HTTP 404' <<< "$body"; then
            state=""
          else
            echo "::error::Team membership lookup failed: $body"
            exit 1
          fi
          if [ "$state" = "active" ]; then
            echo "isTeamMember=true" >> "$GITHUB_OUTPUT"
          else
            echo "isTeamMember=false" >> "$GITHUB_OUTPUT"
          fi
  send-response:
    name: 'Alert user to change freeze'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    needs: [check-ownership]
    if: ${{ needs.check-ownership.outputs.isTeamMember == 'false' }}
    steps:
      - uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: |
            This repo is currently under a community change freeze. Please see any pinned issues for more information.
            If you believe this PR should be merged, please respond with the reason why else we will close all PRs until after the change freeze is lifted.
