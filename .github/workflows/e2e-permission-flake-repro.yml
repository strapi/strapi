name: 'E2E permission flake repro'

# Temporary, do not merge. Runs the permission specs that failed on develop on Nov 2 (run
# 41509664490) many times without retries, keeping a trace for every failure. Each variant
# applies one patch from .github/repro/ on top of develop, so their failure rates can be compared
# in a single run:
# - develop: no patch
# - fix-signout: the candidate fix for the sign-out race from #27368
# (Earlier runs also compared revert-27368, form-login and settle-before-login.)

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Monorepo install
        uses: ./.github/actions/yarn-nm-install
      - name: Monorepo build
        uses: ./.github/actions/run-build

  repro:
    needs: build
    name: '${{ matrix.variant }}: ${{ matrix.suite.name }} (${{ matrix.suite.project }}) #${{ matrix.copy }}'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host --init
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3]
        variant: [develop, fix-signout]
        suite:
          - name: cm-edit-view-errors
            domains: content-manager
            project: webkit
            repeat: 10
            filter: collection-type-edit-view-errors.spec.ts:33
          - name: i18n-permissions
            domains: i18n
            project: webkit
            repeat: 10
            filter: permissions.spec.ts:23
          - name: admin-tokens-ownership
            domains: admin
            project: webkit
            repeat: 10
            filter: admin-tokens.spec.ts:173
          - name: rbac-permissions-enforcement
            domains: settings
            project: webkit
            repeat: 10
            filter: permissions-enforcement.spec.ts:14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Monorepo install
        uses: ./.github/actions/yarn-nm-install
      - name: Monorepo build
        uses: ./.github/actions/run-build
      - name: Apply the variant's patch
        if: ${{ matrix.variant != 'develop' }}
        env:
          VARIANT: ${{ matrix.variant }}
        run: git apply ".github/repro/$VARIANT.patch"
      # The fix changes @strapi/admin, so its build restored from the build job is stale.
      - name: Rebuild the admin package
        if: ${{ matrix.variant == 'fix-signout' }}
        run: yarn nx run @strapi/admin:build --nx-ignore-cycles --skip-nx-cache --excludeTaskDependencies
      - name: Run the spec repeatedly
        id: e2e
        continue-on-error: true
        uses: ./.github/actions/run-e2e-tests
        with:
          runEE: false
          domains: ${{ matrix.suite.domains }}
          jestOptions: '--project=${{ matrix.suite.project }} --repeat-each=${{ matrix.suite.repeat }} --retries=0 --trace=retain-on-failure ${{ matrix.suite.filter }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.e2e.outcome == 'failure' }}
        with:
          name: repro-${{ matrix.variant }}-${{ matrix.suite.name }}-${{ matrix.suite.project }}-${{ matrix.copy }}
          path: test-apps/e2e/test-results/**/trace.zip
          retention-days: 3
      - name: Fail when any repetition failed
        if: ${{ steps.e2e.outcome == 'failure' }}
        run: exit 1
